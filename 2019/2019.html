<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Image Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-1: #1e1b4b;
            --bg-2: #312e81;
            --bg-3: #6d28d9;
            --accent: #f472b6;
            --accent-2: #a78bfa;
            --text: #f8fafc;
            --text-muted: #c7d2fe;
            --card-border: rgba(255, 255, 255, 0.18);
            --glass: rgba(255, 255, 255, 0.08);
            --glass-strong: rgba(255, 255, 255, 0.14);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            color: var(--text);
            text-align: center;
            background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 45%, var(--bg-3) 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* Floating background orbs */
        .bg-orbs { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.45; animation: float 16s ease-in-out infinite; }
        .orb-1 { width: 380px; height: 380px; background: #ec4899; top: -80px; left: -60px; }
        .orb-2 { width: 320px; height: 320px; background: #8b5cf6; bottom: -60px; right: -40px; animation-delay: -5s; }
        .orb-3 { width: 260px; height: 260px; background: #38bdf8; top: 45%; left: 65%; animation-delay: -9s; }
        @keyframes float { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(24px, -32px) scale(1.08); } }

        .wrap { position: relative; z-index: 1; max-width: 1320px; margin: 0 auto; padding: 40px 24px 72px; }

        /* Header */
        .gallery-header { margin-bottom: 36px; }
        .home-btn {
            position: fixed;
            top: 22px;
            left: 22px;
            z-index: 5;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text);
            text-decoration: none;
            background: var(--glass-strong);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            transition: transform 0.25s ease, background 0.25s ease;
        }
        .home-btn:hover { transform: translateY(-2px); background: rgba(255, 255, 255, 0.22); }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            margin: 8px 0 14px;
            letter-spacing: -0.01em;
            text-shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
        }
        h1 .accent {
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .photo-count {
            display: inline-block;
            margin: 0;
            padding: 6px 16px;
            font-size: 0.82rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-muted);
            background: var(--glass);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            backdrop-filter: blur(8px);
        }

        /* Status (loading / empty) */
        .status { color: var(--text-muted); font-size: 1rem; margin: 60px 0; }
        .spinner {
            width: 46px; height: 46px; margin: 0 auto 18px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Masonry gallery (preserves photo aspect ratios) */
        .gallery {
            column-count: 4;
            column-gap: 18px;
        }
        @media (max-width: 1100px) { .gallery { column-count: 3; } }
        @media (max-width: 760px)  { .gallery { column-count: 2; } }

        .tile {
            position: relative;
            width: 100%;
            margin: 0 0 18px;
            break-inside: avoid;
            overflow: hidden;
            border-radius: 18px;
            border: 1px solid var(--card-border);
            background: var(--glass);
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.22);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .tile:hover { transform: translateY(-6px); box-shadow: 0 18px 44px rgba(244, 114, 182, 0.32); }
        .tile img {
            width: 100%;
            display: block;
            opacity: 0;
            transform: scale(1.04);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .tile img.loaded { opacity: 1; transform: scale(1); }
        .tile:hover img.loaded { transform: scale(1.05); }

        /* Hover overlay with date caption */
        .tile-meta {
            position: absolute;
            left: 0; right: 0; bottom: 0;
            display: flex; align-items: center; gap: 8px;
            padding: 30px 16px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            color: #fff;
            text-align: left;
            background: linear-gradient(to top, rgba(0,0,0,0.72), transparent);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            pointer-events: none;
        }
        .tile:hover .tile-meta { opacity: 1; transform: translateY(0); }
        .tile-meta svg { width: 15px; height: 15px; flex: none; opacity: 0.9; }

        /* Pagination */
        .pagination { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 44px; }
        .pagination button {
            padding: 12px 26px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem; font-weight: 500;
            color: var(--text); cursor: pointer;
            background: var(--glass-strong);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        }
        .pagination button:hover:not(:disabled) {
            transform: translateY(-2px);
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            box-shadow: 0 12px 30px rgba(244, 114, 182, 0.35);
        }
        .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-indicator { font-size: 0.9rem; color: var(--text-muted); min-width: 110px; }

        /* Lightbox */
        .lightbox {
            position: fixed; inset: 0; z-index: 50;
            display: flex; align-items: center; justify-content: center;
            background: rgba(10, 8, 26, 0.92);
            backdrop-filter: blur(10px);
            opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .lightbox.open { opacity: 1; visibility: visible; }
        .lb-img {
            max-width: 88vw; max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            transform: scale(0.96);
            transition: transform 0.3s ease;
        }
        .lightbox.open .lb-img { transform: scale(1); }
        .lb-close, .lb-nav {
            position: absolute;
            display: flex; align-items: center; justify-content: center;
            color: var(--text); cursor: pointer;
            background: var(--glass-strong);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .lb-close:hover, .lb-nav:hover { background: rgba(255,255,255,0.25); transform: scale(1.08); }
        .lb-close { top: 22px; right: 22px; width: 48px; height: 48px; font-size: 1.6rem; line-height: 1; }
        .lb-nav { top: 50%; transform: translateY(-50%); width: 56px; height: 56px; font-size: 2.2rem; line-height: 1; }
        .lb-nav:hover { transform: translateY(-50%) scale(1.08); }
        .lb-prev { left: 22px; }
        .lb-next { right: 22px; }
        .lb-bar {
            position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 18px;
            padding: 10px 22px;
            background: var(--glass-strong);
            border: 1px solid var(--card-border);
            border-radius: 999px;
            backdrop-filter: blur(8px);
            font-size: 0.88rem;
            white-space: nowrap;
        }
        .lb-bar a { color: var(--accent); text-decoration: none; font-weight: 500; }
        .lb-bar a:hover { text-decoration: underline; }
        .lb-sep { opacity: 0.4; }

        @media (max-width: 600px) {
            .wrap { padding: 72px 14px 56px; }
            .gallery { column-gap: 12px; }
            .tile { margin-bottom: 12px; }
            .lb-nav { width: 44px; height: 44px; font-size: 1.8rem; }
            .lb-close { width: 42px; height: 42px; }
            .lb-bar { font-size: 0.8rem; gap: 12px; padding: 9px 16px; }
        }
    </style>
</head>
<body>
    <div class="bg-orbs" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <a class="home-btn" href="https://leemgs.github.io/with-people/">← Home</a>

    <div class="wrap">
        <header class="gallery-header">
            <h1 id="galleryTitle">Image Gallery</h1>
            <p class="photo-count" id="photoCount"></p>
        </header>

        <div id="status" class="status">
            <div class="spinner"></div>
            Loading photos…
        </div>

        <main id="gallery" class="gallery"></main>

        <div class="pagination" id="pagination" style="display:none;">
            <button id="prevBtn" onclick="changePage(-1)" disabled>← Previous</button>
            <span class="page-indicator" id="pageIndicator"></span>
            <button id="nextBtn" onclick="changePage(1)">Next →</button>
        </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
        <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
        <button class="lb-nav lb-prev" id="lbPrev" aria-label="Previous">&lsaquo;</button>
        <img class="lb-img" id="lbImg" src="" alt="">
        <button class="lb-nav lb-next" id="lbNext" aria-label="Next">&rsaquo;</button>
        <div class="lb-bar">
            <span id="lbDate"></span>
            <span class="lb-sep">•</span>
            <span id="lbCounter"></span>
            <span class="lb-sep">•</span>
            <a id="lbOpen" href="#" target="_blank" rel="noopener">Open original ↗</a>
        </div>
    </div>

    <script>
        let images = [];
        let currentPage = 1;
        let lightboxIndex = 0;
        const imagesPerPage = 12;

        const CALENDAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';

        function extractYearFromUrl() {
            const fileName = window.location.pathname.split('/').pop();
            return fileName.split('.')[0];
        }

        // Parse a YYYYMMDD prefix from the filename into a friendly date.
        function parseDate(filename) {
            const m = filename.match(/(\d{4})(\d{2})(\d{2})/);
            if (!m) return '';
            const [, y, mo, d] = m;
            const date = new Date(`${y}-${mo}-${d}T00:00:00`);
            if (isNaN(date.getTime())) return '';
            return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        }

        function setPageTitleAndHeader() {
            const year = extractYearFromUrl();
            document.getElementById('pageTitle').innerText = `Image Gallery (${year})`;
            document.getElementById('galleryTitle').innerHTML = `Memories of <span class="accent">${year}</span>`;
        }

        async function loadImages() {
            const status = document.getElementById('status');
            try {
                const response = await fetch('input.txt');
                if (!response.ok) throw new Error('input.txt not found');
                const text = await response.text();
                images = text.split('\n').map(l => l.trim()).filter(Boolean);

                if (images.length === 0) {
                    status.innerHTML = '📭 No photos here yet. Check back soon!';
                    return;
                }
                status.style.display = 'none';
                document.getElementById('photoCount').innerText =
                    `${images.length} photo${images.length > 1 ? 's' : ''}`;
                document.getElementById('pagination').style.display = 'flex';
                displayImages();
            } catch (error) {
                console.error('Error loading images:', error);
                status.innerHTML = '⚠️ Could not load photos.';
            }
        }

        function displayImages() {
            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';

            const startIndex = (currentPage - 1) * imagesPerPage;
            const endIndex = Math.min(startIndex + imagesPerPage, images.length);

            for (let i = startIndex; i < endIndex; i++) {
                const name = images[i];
                const date = parseDate(name);

                const tile = document.createElement('div');
                tile.className = 'tile';

                const img = document.createElement('img');
                img.src = `./${name}`;
                img.alt = date || name;
                img.loading = 'lazy';
                img.addEventListener('load', () => img.classList.add('loaded'));
                if (img.complete) img.classList.add('loaded');
                tile.appendChild(img);

                if (date) {
                    const meta = document.createElement('div');
                    meta.className = 'tile-meta';
                    meta.innerHTML = `${CALENDAR_ICON}<span>${date}</span>`;
                    tile.appendChild(meta);
                }

                const index = i;
                tile.addEventListener('click', () => openLightbox(index));
                gallery.appendChild(tile);
            }

            const totalPages = Math.ceil(images.length / imagesPerPage);
            document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = endIndex >= images.length;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changePage(direction) {
            currentPage += direction;
            displayImages();
        }

        /* ---- Lightbox ---- */
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');

        function openLightbox(index) {
            lightboxIndex = index;
            updateLightbox();
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('open');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const name = images[lightboxIndex];
            const src = `./${name}`;
            lbImg.src = src;
            lbImg.alt = name;
            const date = parseDate(name);
            document.getElementById('lbDate').innerText = date || name;
            document.getElementById('lbCounter').innerText = `${lightboxIndex + 1} / ${images.length}`;
            document.getElementById('lbOpen').href = src;
        }

        function lightboxStep(direction) {
            lightboxIndex = (lightboxIndex + direction + images.length) % images.length;
            updateLightbox();
        }

        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lbPrev').addEventListener('click', () => lightboxStep(-1));
        document.getElementById('lbNext').addEventListener('click', () => lightboxStep(1));
        lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'Escape') closeLightbox();
            else if (e.key === 'ArrowRight') lightboxStep(1);
            else if (e.key === 'ArrowLeft') lightboxStep(-1);
        });

        window.onload = function() {
            setPageTitleAndHeader();
            loadImages();
        };
    </script>
</body>
</html>
